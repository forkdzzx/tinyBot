<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis · P1 表达原型</title>
<style>
  :root { color-scheme:dark; font-family:system-ui,sans-serif; background:#0a101c; color:#e2edf9 }
  body { max-width:820px; margin:36px auto; padding:0 20px }
  h1 { font-size:26px } p { color:#a8bdd5; line-height:1.7 }
  #face { background:#020710; border:1px solid #26354c; border-radius:44px; height:300px; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:24px 0 }
  .eyes { display:flex; gap:46px; height:100px; align-items:center; transition:transform .2s }
  .eye { width:115px; height:65px; background:#53e0ef; border-radius:50%; box-shadow:0 0 30px #53e0ef40; transition:height .15s,opacity .15s }
  #face[data-phase="disabled"] .eye, #face[data-phase="off"] .eye { opacity:0 }
  #face[data-phase="thinking"] .eyes { transform:rotate(-9deg); animation:think 1.5s infinite alternate }
  #face[data-phase="speaking"] .eye { animation:speak .7s infinite alternate }
  #face[data-phase="idle"] .eye { height:40px }
  #face[data-motion="nod"] .eyes { animation:nod .8s ease-in-out 1 }
  @keyframes think { to { opacity:.5 } } @keyframes speak { to { height:48px } }
  @keyframes nod { 50% { transform:translateY(12px) } }
  #caption { min-height:48px; margin:26px 24px 0; max-width:90%; line-height:1.5; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical }
  .controls { display:flex; flex-wrap:wrap; gap:10px; margin:14px 0 }
  button,select { background:#18263b; color:inherit; border:1px solid #36506d; border-radius:9px; padding:10px 14px; font:inherit }
  button { cursor:pointer } button:hover { background:#26405e }
  pre { white-space:pre-wrap; font-size:13px; background:#101a29; padding:16px; border-radius:12px; max-height:220px; overflow:auto }
</style>
<h1>Jarvis <small>· P1 表达原型</small></h1>
<p>本地事件模拟。按钮代替语音输入，眼睛展示倾听、思考与说话；点头仅为画面模拟。此页不会采集麦克风、调用云服务或关闭电脑。</p>
<div id="face" data-phase="disabled"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div id="caption"></div></div>
<div id="status" role="status"></div>
<div class="controls"><button id="power">模拟实体按键</button><select id="phrase" aria-label="唤醒短句"></select><button id="wake">模拟唤醒成功</button></div>
<div class="controls"><button id="ask">模拟问完问题</button><button id="reply">模拟回答到达</button><button id="interrupt">插话打断</button><button id="late">注入旧轮次结果</button><button id="done">播报结束</button><button id="end">结束会话</button></div>
<p>体验顺序：实体按键 → 唤醒 → 问完问题 → 回答到达 → 插话打断 → 注入旧结果。旧结果应被忽略，字幕与模拟动作应清空。</p>
<pre id="log" aria-label="事件记录"></pre>
<script type="module">
import { initialState, transition, WAKE_PHRASES } from './state.mjs';
let state = initialState();
let requestedTurn = null;
const el = id => document.getElementById(id);
const names = { disabled:'已启动，交互未启用', off:'模拟关机', idle:'待机', listening:'倾听', thinking:'思考', speaking:'说话' };
for (const phrase of WAKE_PHRASES) el('phrase').add(new Option(phrase,phrase));
function render() {
  el('face').dataset.phase = state.phase;
  el('face').dataset.motion = state.motion;
  el('caption').textContent = state.caption;
  el('status').textContent = `${names[state.phase]} · 轮次 ${state.turn} · 模拟动作 ${state.motion}`;
}
function send(event) {
  const before = state;
  state = transition(state,event);
  el('log').textContent = `${new Date().toLocaleTimeString()} ${event.type}: ${state === before ? '忽略' : names[state.phase]}\n` + el('log').textContent.slice(0,6000);
  render();
}
el('power').onclick = () => send({type:'button'});
el('wake').onclick = () => send({type:'wake',phrase:el('phrase').value});
el('ask').onclick = () => { send({type:'submit',text:'模拟问题：你能陪我练英语吗？'}); if(state.phase === 'thinking') requestedTurn = state.turn; };
el('reply').onclick = () => send({type:'answer',turn:requestedTurn,text:'模拟回答：当然。What did you do today?'});
el('interrupt').onclick = () => send({type:'interrupt'});
el('late').onclick = () => send({type:'answer',turn:state.turn-1,text:'旧回答不应出现在这里。'});
el('done').onclick = () => send({type:'finished',turn:state.turn});
el('end').onclick = () => send({type:'end'});
render();
</script>
</html>
